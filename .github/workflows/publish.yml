name: Test and publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
      GPGWRAP_REQUIRE_AGENT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gnupg libegl1 libopengl0 libxkbcommon0
      - name: Install application and tests
        run: python -m pip install . pytest
      - name: Run regression and GnuPG integration tests
        run: python -m pytest -q

  build-and-publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/gpgwrap/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Check release version
        run: |
          python - <<'PY'
          import os
          import runpy
          import tomllib
          from pathlib import Path
          package = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          application = runpy.run_path("src/gpgwrap/__init__.py")["__version__"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{package}" or application != package:
              raise SystemExit(f"Version mismatch: tag={tag}, package={package}, application={application}")
          PY
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
